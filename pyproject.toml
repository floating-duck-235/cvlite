[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cvlite"
version = "1.0.0"
description = "Computer vision examples for Google Colab, with an explanation of every function used"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools.packages.find]
include = ["cvlite*"]
